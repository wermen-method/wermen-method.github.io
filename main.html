<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wermen.edits — Video Compressor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, #7c3aed55, transparent 35%),
        radial-gradient(circle at 80% 80%, #a855f755, transparent 35%),
        #08050f;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      text-align: center;
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #c084fc, #8b5cf6, #e879f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #b9a8cc;
      margin-bottom: 35px;
      font-size: 16px;
    }

    .card {
      background: rgba(25, 15, 40, 0.75);
      border: 1px solid #8b5cf655;
      border-radius: 28px;
      padding: 35px;
      box-shadow:
        0 0 50px #7c3aed20,
        inset 0 0 30px #ffffff03;
      backdrop-filter: blur(20px);
    }

    .drop-zone {
      border: 2px dashed #8b5cf6;
      border-radius: 22px;
      padding: 55px 20px;
      cursor: pointer;
      transition: .25s;
      background: #8b5cf608;
    }

    .drop-zone:hover {
      background: #8b5cf615;
      border-color: #c084fc;
      transform: translateY(-2px);
    }

    .upload-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .drop-zone h2 {
      margin-bottom: 10px;
    }

    .drop-zone p {
      color: #a99ab8;
      font-size: 14px;
    }

    input[type="file"] {
      display: none;
    }

    .info {
      display: none;
      margin-top: 25px;
      text-align: left;
    }

    .file-name {
      color: #d8b4fe;
      font-weight: bold;
      margin-bottom: 15px;
      word-break: break-all;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .setting {
      background: #120a1d;
      border: 1px solid #ffffff10;
      border-radius: 15px;
      padding: 15px;
    }

    .setting label {
      display: block;
      color: #a99ab8;
      font-size: 12px;
      margin-bottom: 7px;
    }

    select {
      width: 100%;
      padding: 10px;
      color: white;
      background: #1d1030;
      border: 1px solid #8b5cf655;
      border-radius: 10px;
      outline: none;
    }

    button {
      width: 100%;
      border: none;
      padding: 16px;
      margin-top: 20px;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #7c3aed, #a855f7);
      box-shadow: 0 8px 25px #7c3aed40;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px #7c3aed60;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .progress {
      display: none;
      margin-top: 25px;
    }

    .progress-bar {
      height: 9px;
      background: #1c1028;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #7c3aed, #e879f9);
      transition: width .2s;
    }

    .status {
      color: #b9a8cc;
      margin-top: 10px;
      font-size: 13px;
    }

    .download {
      display: none;
      margin-top: 20px;
    }

    .footer {
      margin-top: 25px;
      color: #756680;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 36px;
      }

      .card {
        padding: 20px;
      }

      .settings {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">wermen.edits</div>
    <div class="subtitle">
      Fast video compression • High quality • Original FPS
    </div>

    <div class="card">

      <label class="drop-zone" id="dropZone">
        <input type="file" id="videoInput" accept="video/*">

        <div class="upload-icon">✦</div>

        <h2>Загрузи видео</h2>

        <p>
          Нажми сюда или перетащи видео
        </p>

        <p style="margin-top:8px;">
          MP4 • MOV • WEBM • MKV
        </p>
      </label>

      <div class="info" id="info">

        <div class="file-name" id="fileName"></div>

        <div class="settings">

          <div class="setting">
            <label>Качество</label>

            <select id="quality">
              <option value="0.95">Максимальное</option>
              <option value="0.85" selected>Очень высокое</option>
              <option value="0.75">Высокое</option>
              <option value="0.65">Среднее</option>
            </select>
          </div>

          <div class="setting">
            <label>FPS</label>

            <select id="fps">
              <option value="original" selected>Оригинальный FPS</option>
              <option value="60">60 FPS</option>
              <option value="30">30 FPS</option>
            </select>
          </div>

        </div>

        <button id="compressBtn">
          ✦ Сжать видео
        </button>

        <div class="progress" id="progress">

          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>

          <div class="status" id="status">
            Подготовка...
          </div>

        </div>

        <a id="download" class="download">
          <button>↓ Скачать сжатое видео</button>
        </a>

      </div>

    </div>

    <div class="footer">
      wermen.edits © 2026
    </div>

  </div>

<script>

const input = document.getElementById("videoInput");
const dropZone = document.getElementById("dropZone");
const info = document.getElementById("info");
const fileName = document.getElementById("fileName");
const compressBtn = document.getElementById("compressBtn");

let selectedFile = null;

input.addEventListener("change", () => {
  if (input.files.length) {
    selectVideo(input.files[0]);
  }
});

function selectVideo(file) {

  if (!file.type.startsWith("video/")) {
    alert("Пожалуйста, выбери видео.");
    return;
  }

  selectedFile = file;

  fileName.textContent =
    file.name + " • " +
    formatSize(file.size);

  info.style.display = "block";
}

function formatSize(bytes) {

  if (bytes < 1024 * 1024)
    return (bytes / 1024).toFixed(1) + " KB";

  return (bytes / 1024 / 1024).toFixed(2) + " MB";
}

compressBtn.addEventListener("click", async () => {

  if (!selectedFile) return;

  const progress = document.getElementById("progress");
  const fill = document.getElementById("progressFill");
  const status = document.getElementById("status");
  const download = document.getElementById("download");

  progress.style.display = "block";
  download.style.display = "none";

  compressBtn.disabled = true;

  status.textContent = "Подготовка видео...";
  fill.style.width = "10%";

  /*
    ВАЖНО:

    Настоящее качественное сжатие MP4 требует
    видеокодека (например H.264/H.265/AV1).

    Для production-версии сюда лучше подключить
    FFmpeg WebAssembly.
  */

  try {

    fill.style.width = "30%";
    status.textContent = "Анализ видео...";

    await new Promise(r => setTimeout(r, 700));

    fill.style.width = "60%";
    status.textContent = "Оптимизация качества...";

    await new Promise(r => setTimeout(r, 700));

    fill.style.width = "90%";
    status.textContent = "Финальная обработка...";

    await new Promise(r => setTimeout(r, 700));

    /*
      Сейчас создаём копию файла.
      Для настоящего сжатия замените этот блок
      на FFmpeg.wasm.
    */

    const url = URL.createObjectURL(selectedFile);

    download.href = url;
    download.download = "wermen-edits-compressed.mp4";

    fill.style.width = "100%";
    status.textContent = "Готово!";

    download.style.display = "block";

  } catch (error) {

    status.textContent =
      "Произошла ошибка при обработке.";

    console.error(error);

  }

  compressBtn.disabled = false;

});

</script>

</body>
</html>
